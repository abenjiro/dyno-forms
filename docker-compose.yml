services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dyno-forms-app
    ports:
      - "${APP_PORT:-3050}:${APP_PORT:-3050}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=${APP_PORT:-3050}
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_MOCK_API_URL=${NEXT_PUBLIC_MOCK_API_URL:-http://localhost:4050}
    depends_on:
      mock-api:
        condition: service_healthy
    networks:
      - dyno-network

  mock-api:
    build:
      context: docker/mock-server
      dockerfile: Dockerfile
    container_name: dyno-forms-mock-api
    ports:
      - "${MOCK_API_PORT:-4050}:${MOCK_API_PORT:-4050}"
    environment:
      - PORT=${MOCK_API_PORT:-4050}
    volumes:
      - ./docker/mock-server/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4050) + '/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - dyno-network

networks:
  dyno-network:
    driver: bridge
