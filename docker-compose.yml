services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dyno-forms-app
    ports:
      - "${APP_PORT:-3050}:${APP_PORT:-3050}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=${APP_PORT:-3050}
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_MOCK_API_URL=${NEXT_PUBLIC_MOCK_API_URL:-http://localhost:4050}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://dyno:dyno_secret@db:5432/dyno_forms?schema=public}
      - JWT_SECRET=${JWT_SECRET:-dyno_jwt_super_secret_key_2026_phase2_min32chars}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      mock-api:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - dyno-network

  db:
    image: postgres:16-alpine
    container_name: dyno-forms-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5450}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dyno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dyno_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dyno_forms}
    volumes:
      - dyno-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyno -d dyno_forms"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dyno-network

  mock-api:
    build:
      context: docker/mock-server
      dockerfile: Dockerfile
    container_name: dyno-forms-mock-api
    ports:
      - "${MOCK_API_PORT:-4050}:${MOCK_API_PORT:-4050}"
    environment:
      - PORT=${MOCK_API_PORT:-4050}
    volumes:
      - ./docker/mock-server/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4050) + '/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - dyno-network

networks:
  dyno-network:
    driver: bridge

volumes:
  dyno-db-data:
